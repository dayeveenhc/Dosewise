[project]
name = "hermes"
version = "0.1.0"
description = "Dosewise Hermes — Claude Sonnet 5 orchestrator + safety rails for an agent-first medication app"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.49",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt>=2.8",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
hermes-chat = "hermes.channels.cli:main"
hermes-serve = "hermes.main:serve"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
