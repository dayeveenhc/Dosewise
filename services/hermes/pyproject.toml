[project]
name = "hermes"
version = "0.1.0"
description = "Dosewise Hermes — OpenAI orchestrator (Gemini/Claude fallback) + safety rails for an agent-first medication app"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.49",
    "google-genai>=0.3",
    "openai>=1.50",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # [crypto] pulls in `cryptography` for verifying Supabase's asymmetric
    # (ES256/RS256) access tokens against the project JWKS (db/auth.py).
    "pyjwt[crypto]>=2.8",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    # Prescription/medical-history PDF text extraction (Telegram document uploads).
    "pypdf>=4.2",
    # Optional at runtime (lazy-imported): dialect slang store + local language ID.
    # The service degrades gracefully if these are absent (slang off / STT autodetect).
    "motor>=3.4",
    "fasttext-wheel>=0.9.2",
    "huggingface-hub>=0.24",
]

[project.scripts]
hermes-chat = "hermes.channels.cli:main"
hermes-serve = "hermes.main:serve"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: exercises a live local Supabase (skipped in the offline suite)",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# pyflakes (F), pycodestyle (E/W), isort (I), pyupgrade (UP), bugbear (B).
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Tests poke private registry internals and use broad fixtures.
"tests/*" = ["B018"]
